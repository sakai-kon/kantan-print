<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>かんたん印刷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🖨️</div>
      <div>
        <h1>かんたん印刷</h1>
        <p>スキャンした紙に文字を入れて、そのまま印刷</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="undoButton" class="tool-button" disabled>↶ 元に戻す</button>
      <button id="redoButton" class="tool-button" disabled>↷ やり直す</button>
      <button id="printButton" class="primary print-button" disabled>🖨️ 印刷する</button>
    </div>
  </header>

  <main>
    <section id="startScreen" class="start-screen">
      <div id="dropZone" class="drop-zone">
        <div class="drop-icon">📄</div>
        <h2>スキャンしたファイルを開く</h2>
        <p>画像（JPG・PNG・WEBP）やPDFをここから開けます。</p>
        <label class="file-button">
          📂 ファイルを選ぶ
          <input id="fileInput" type="file" accept="image/*,.pdf,application/pdf" hidden>
        </label>
        <p class="hint">ファイルをこの場所へドラッグ＆ドロップしても開けます。</p>
      </div>
    </section>

    <section id="editor" class="editor hidden">
      <aside class="sidebar">
        <div class="side-section">
          <h2>編集</h2>
          <button id="addTextButton" class="big-button">🔤 文字を入れる</button>
          <button id="cropButton" class="big-button">✂️ 切り取る</button>
          <button id="rotateButton" class="big-button">🔄 90°回す</button>
          <button id="resetButton" class="big-button">↺ このページを元に戻す</button>
        </div>

        <div class="side-section">
          <h2>大きさ</h2>
          <label class="range-row">
            <span id="scaleLabel">100%</span>
            <input id="scaleRange" type="range" min="25" max="200" value="100">
          </label>
        </div>

        <div class="side-section">
          <h2>きれいにする</h2>
          <label class="range-row"><span>明るさ</span><input id="brightnessRange" type="range" min="60" max="160" value="100"></label>
          <label class="range-row"><span>コントラスト</span><input id="contrastRange" type="range" min="60" max="180" value="100"></label>
          <button id="grayscaleButton" class="big-button">⚫ 白黒にする</button>
        </div>

        <div class="side-section">
          <h2>ファイル</h2>
          <button id="newFileButton" class="big-button">📄 別のファイルを開く</button>
        </div>
      </aside>

      <section class="workspace">
        <div id="cropNotice" class="crop-notice hidden">切り取りたい範囲をマウスでドラッグしてください。<button id="cancelCropButton">キャンセル</button><button id="applyCropButton" class="primary small">ここで切り取る</button></div>
        <div id="pageArea" class="page-area">
          <canvas id="documentCanvas"></canvas>
          <div id="textLayer"></div>
          <div id="cropOverlay" class="crop-overlay hidden"></div>
        </div>
        <div id="emptyHint" class="empty-hint hidden">ここに読み込んだ紙が表示されます</div>

        <div class="page-controls" id="pageControls">
          <button id="prevPageButton">◀ 前のページ</button>
          <span id="pageIndicator">1 / 1</span>
          <button id="nextPageButton">次のページ ▶</button>
        </div>
      </section>
    </section>
  </main>

  <div id="textDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="textDialogTitle">
    <div class="dialog">
      <h2 id="textDialogTitle">文字を入れる</h2>
      <label class="field-label" for="textInput">文字</label>
      <textarea id="textInput" rows="4" placeholder="ここに文字を入力してください"></textarea>
      <div class="two-columns">
        <label class="field-label">文字の大きさ<input id="textSize" type="range" min="12" max="96" value="28"></label>
        <label class="field-label">文字の色<input id="textColor" type="color" value="#111111"></label>
      </div>
      <div class="style-buttons">
        <button id="boldTextButton" type="button">太字</button>
        <button id="verticalTextButton" type="button">縦書き</button>
      </div>
      <div class="dialog-actions">
        <button id="cancelText">キャンセル</button>
        <button id="confirmText" class="primary">文字を入れる</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
